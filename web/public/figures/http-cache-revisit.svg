<text x="40" y="48" font-size="20" fill="#1d1d1f" font-weight="700" text-anchor="start">배포 다음 날, 같은 사용자가 다시 들어왔을 때</text>
<text x="40" y="74" font-size="14" fill="#6b6760" font-weight="400" text-anchor="start">HTML은 매번 확인하고(no-cache), 해시 파일명 에셋은 확인 없이 재사용합니다(immutable)</text>
