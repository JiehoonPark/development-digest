<marker id="arA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a64d31"/></marker></defs>
<rect width="900" height="380" fill="#f4f1ea"/>
<text x="40" y="48" font-size="20" fill="#1d1d1f" font-weight="700" text-anchor="start">서버 컴포넌트가 클라이언트 컴포넌트를 렌더링할 때 오가는 것</text>
<text x="40" y="74" font-size="14" fill="#6b6760" font-weight="400" text-anchor="start">props는 값으로, Counter의 코드는 청크 주소로 보내고 브라우저가 그 청크를 따로 받습니다</text>
<rect x="40" y="108" width="250" height="230" rx="10" fill="#fff" stroke="#d8d3c8" stroke-width="1.2"/>
