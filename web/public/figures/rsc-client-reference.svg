<text x="60" y="166" font-size="14" fill="#1d1d1f" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,monospace">&lt;Comments&gt;</text>
<text x="76" y="192" font-size="14" fill="#1d1d1f" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">&lt;Counter</text>
<text x="92" y="214" font-size="14" fill="#1d1d1f" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">initialCount={10} /&gt;</text>
<text x="60" y="252" font-size="13" fill="#6b6760" font-weight="400" text-anchor="start">Counter는 'use client'</text>
<text x="60" y="274" font-size="13" fill="#6b6760" font-weight="400" text-anchor="start">파일에 있음</text>
<rect x="330" y="128" width="250" height="150" rx="10" fill="#fff" stroke="#a64d31" stroke-width="1.6"/>
<text x="348" y="154" font-size="13" fill="#a64d31" font-weight="700" text-anchor="start">RSC 페이로드</text>
<text x="348" y="186" font-size="14" fill="#6b6760" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,monospace">type:</text>
<text x="348" y="208" font-size="14" fill="#a64d31" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,monospace">'chunk123.js#Counter'</text>
