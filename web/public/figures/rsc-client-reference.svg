<rect x="620" y="108" width="240" height="230" rx="10" fill="#fff" stroke="#d8d3c8" stroke-width="1.2"/>
<text x="640" y="136" font-size="13" fill="#6b6760" font-weight="600" text-anchor="start">브라우저</text>
<text x="640" y="170" font-size="14" fill="#1d1d1f" font-weight="400" text-anchor="start">① 페이로드 해석</text>
<text x="640" y="200" font-size="14" fill="#a64d31" font-weight="600" text-anchor="start">② chunk123.js 요청</text>
<text x="640" y="230" font-size="14" fill="#1d1d1f" font-weight="400" text-anchor="start">③ Counter 꺼내 렌더링</text>
