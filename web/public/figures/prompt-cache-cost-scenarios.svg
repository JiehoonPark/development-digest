<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <rect width="900" height="340" fill="#f4f1ea"/>
  <text x="32" y="40" font-size="18" font-weight="700" fill="#1d1d1f">같은 30턴 대화, 입력 비용은 앞부분을 지키느냐에 달렸다</text>
  <text x="32" y="64" font-size="13" fill="#6b6760">cache_sim.py 모의 계산. 캐시 없음 = 100%. 쓰기 1.25배 · 읽기 0.1배, 시작 7,850토큰 + 턴마다 1,500토큰.</text>

  <!-- scale: 100% = 440px, bars start at x=300 -->
  <line x1="740" y1="90" x2="740" y2="290" stroke="#d8d3c8" stroke-dasharray="4 4"/>
  <text x="740" y="308" font-size="11" fill="#6b6760" text-anchor="middle">100%</text>

  <text x="32" y="118" font-size="13" fill="#1d1d1f">캐시 없음</text>
  <rect x="300" y="102" width="440" height="24" rx="3" fill="#6b6760"/>
  <text x="750" y="119" font-size="13" font-weight="700" fill="#1d1d1f">100%</text>

  <text x="32" y="166" font-size="13" fill="#1d1d1f">캐시 유지(앞부분 그대로)</text>
  <rect x="300" y="150" width="73" height="24" rx="3" fill="#a64d31"/>
  <text x="383" y="167" font-size="13" font-weight="700" fill="#a64d31">16.5%</text>

  <text x="32" y="214" font-size="13" fill="#1d1d1f">15턴에서 한 번 놓침</text>
  <rect x="300" y="198" width="88" height="24" rx="3" fill="#a64d31"/>
  <text x="398" y="215" font-size="13" font-weight="700" fill="#a64d31">20.1%</text>

  <text x="32" y="262" font-size="13" fill="#1d1d1f">매 요청 맨 앞에 현재 시각</text>
  <rect x="300" y="246" width="550" height="24" rx="3" fill="#1d1d1f"/>
  <text x="840" y="263" font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">125%</text>
</svg>
