<svg width="900" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard',sans-serif">
<rect width="900" height="300" fill="#f4f1ea"/>
<text x="48" y="58" font-size="20" font-weight="700" fill="#1d1d1f">범위 문법으로 경계를 나눌 때</text>
<text x="48" y="86" font-size="14" fill="#6b6760">채운 점은 경계값을 포함하고, 빈 점은 포함하지 않습니다</text>
<line x1="48" y1="200" x2="852" y2="200" stroke="#1d1d1f" stroke-width="1.5"/>
<line x1="450" y1="190" x2="450" y2="210" stroke="#1d1d1f"/>
<text x="450" y="236" text-anchor="middle" font-size="14" font-family="ui-monospace,Menlo,monospace" fill="#1d1d1f">768px</text>
<line x1="60" y1="150" x2="438" y2="150" stroke="#1d1d1f" stroke-width="6" stroke-linecap="round"/>
<circle cx="450" cy="150" r="9" fill="#f4f1ea" stroke="#1d1d1f" stroke-width="3"/>
<text x="250" y="132" text-anchor="middle" font-size="15" font-family="ui-monospace,Menlo,monospace" fill="#1d1d1f">width &lt; 768px</text>
<line x1="462" y1="166" x2="840" y2="166" stroke="#a64d31" stroke-width="6" stroke-linecap="round"/>
<circle cx="450" cy="166" r="9" fill="#a64d31"/>
<text x="650" y="148" text-anchor="middle" font-size="15" font-family="ui-monospace,Menlo,monospace" fill="#a64d31">width &gt;= 768px</text>
<text x="450" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#1d1d1f">768px은 정확히 한쪽에만 속하고, 빈틈도 겹침도 없습니다</text>
</svg>