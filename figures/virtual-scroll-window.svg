<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <rect width="900" height="460" fill="#f4f1ea"/>
  <text x="40" y="44" font-size="20" font-weight="700" fill="#1d1d1f">가상 스크롤은 전체 높이만 빌려 오고, 보이는 줄만 만든다</text>
  <text x="40" y="70" font-size="14" fill="#6b6760">50,000행 × 48px = 2,400,000px 높이의 빈 상자(spacer) 위에 19개 행만 절대 위치로 올린다</text>

  <!-- spacer column -->
  <rect x="80" y="100" width="150" height="330" fill="none" stroke="#d8d3c8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="155" y="122" font-size="13" text-anchor="middle" fill="#6b6760">spacer</text>
  <text x="155" y="140" font-size="12" text-anchor="middle" fill="#6b6760">height = count × rowHeight</text>
  <text x="155" y="418" font-size="12" text-anchor="middle" fill="#6b6760">DOM에 행 없음</text>

  <!-- overscan + viewport -->
  <rect x="80" y="210" width="150" height="22" fill="#e9e3d6" stroke="#d8d3c8"/>
  <text x="155" y="225" font-size="11" text-anchor="middle" fill="#6b6760">overscan 5행</text>
  <rect x="80" y="232" width="150" height="90" fill="#ffffff" stroke="#a64d31" stroke-width="2.5"/>
  <text x="155" y="272" font-size="13" text-anchor="middle" fill="#a64d31" font-weight="700">보이는 영역</text>
  <text x="155" y="292" font-size="12" text-anchor="middle" fill="#1d1d1f">clientHeight 600px</text>
  <rect x="80" y="322" width="150" height="22" fill="#e9e3d6" stroke="#d8d3c8"/>
  <text x="155" y="337" font-size="11" text-anchor="middle" fill="#6b6760">overscan 5행</text>

  <!-- scrollTop arrow -->
  <line x1="60" y1="100" x2="60" y2="232" stroke="#1d1d1f" stroke-width="1.5"/>
  <polygon points="55,226 65,226 60,234" fill="#1d1d1f"/>
  <text x="52" y="170" font-size="12" fill="#1d1d1f" text-anchor="end" transform="rotate(-90 52 170)">scrollTop</text>

  <!-- arrows to steps -->
  <line x1="240" y1="277" x2="320" y2="277" stroke="#a64d31" stroke-width="2"/>
  <polygon points="320,271 330,277 320,283" fill="#a64d31"/>

  <!-- steps -->
  <g font-size="14" fill="#1d1d1f">
    <rect x="340" y="110" width="520" height="62" rx="8" fill="#ffffff" stroke="#d8d3c8"/>
    <text x="360" y="136" font-weight="700">1 · 첫 행 번호 = floor(scrollTop ÷ rowHeight)</text>
    <text x="360" y="158" font-size="13" fill="#6b6760">scrollTop 480,000 → 10,000번째 행부터 보인다</text>

    <rect x="340" y="186" width="520" height="62" rx="8" fill="#ffffff" stroke="#d8d3c8"/>
    <text x="360" y="212" font-weight="700">2 · 위아래로 overscan만큼 넓힌다</text>
    <text x="360" y="234" font-size="13" fill="#6b6760">{ start: 9995, end: 10018 } → 24개 행</text>

    <rect x="340" y="262" width="520" height="62" rx="8" fill="#ffffff" stroke="#a64d31" stroke-width="2"/>
    <text x="360" y="288" font-weight="700">3 · 그 행만 만들어 translateY(i × rowHeight)로 놓는다</text>
    <text x="360" y="310" font-size="13" fill="#6b6760">나머지 49,976행은 데이터 배열에만 있다</text>

    <rect x="340" y="338" width="520" height="62" rx="8" fill="#ffffff" stroke="#d8d3c8"/>
    <text x="360" y="364" font-weight="700">4 · scroll 이벤트마다 rAF 한 번으로 1~3을 다시 한다</text>
    <text x="360" y="386" font-size="13" fill="#6b6760">화면 밖 행의 검색·포커스·접근성 정보는 직접 보충해야 한다</text>
  </g>
</svg>
