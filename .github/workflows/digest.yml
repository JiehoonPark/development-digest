name: FE 데일리 리포트

on:
  schedule:
    # UTC 23:00 (월~금) = KST 08:00
    - cron: "0 23 * * 0-4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN 모드 (true/false)"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

# deploy-web.yml 과 gh-pages 쓰기 직렬화.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # 심층 글 작성(Opus)·사실 검증·수정이 최대 3회 돌 수 있어 여유를 둔다
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install pipeline dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install yt-dlp
        run: pip install yt-dlp

      # YT_COOKIES 시크릿(Netscape cookies.txt 형식)이 있으면 yt-dlp 봇차단 우회에 사용
      - name: Write YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "YT_COOKIES_FILE=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_ENV"
            echo "YouTube 쿠키 사용"
          else
            echo "YT_COOKIES 미설정 — 쿠키 없이 시도"
          fi

      # GitHub Actions 캐시는 같은 키로 다시 저장되지 않는다(immutable).
      # 고정 키를 쓰면 첫 DB 가 계속 복원돼 발송 이력(seen_urls)이 사라지고 같은 기사가 매일 반복된다.
      # → 복원은 접두사로 가장 최근 것을, 저장은 실행마다 새 키로 한다. 기존 고정 키도 복원 후보로 둔다.
      # dry-run 도 실제와 같은 이력으로 미리보기 하도록 복원은 하되, 저장은 하지 않는다.
      - name: Restore SQLite cache
        uses: actions/cache/restore@v4
        with:
          path: data/dev-digest.db
          key: digest-db-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            digest-db-${{ github.ref_name }}-
            digest-db-${{ github.ref_name }}

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ hashFiles('web/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ hashFiles('web/package-lock.json') }}-

      # 지난 발행본은 gh-pages 에만 있다. 글 JSON·커버도 함께 되살려야 오늘 글이 지난 글 목록과 같이 빌드된다.
      - name: Restore archives, posts and covers from gh-pages
        continue-on-error: true
        run: |
          git fetch origin gh-pages --depth=1 || exit 0
          git checkout origin/gh-pages -- data/archives/ 2>/dev/null || true
          git checkout origin/gh-pages -- data/posts/ 2>/dev/null || true
          if git checkout origin/gh-pages -- covers/ 2>/dev/null; then
            mkdir -p web/public/covers
            cp -n covers/* web/public/covers/ 2>/dev/null || true
            rm -rf covers
          fi

      - name: Run digest pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          # 오늘의 글 커버. 없으면 커버 없이 발행한다
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL || 'https://jiehoonpark.github.io/development-digest/' }}
          LOG_LEVEL: info
        run: npx tsx src/index.ts

      # 발송 후 단계가 실패해도 발송 이력은 남겨야 재실행 때 같은 기사를 다시 보내지 않는다.
      - name: Save SQLite state
        if: always() && !cancelled() && github.event.inputs.dry_run != 'true' && hashFiles('data/dev-digest.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/dev-digest.db
          key: digest-db-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload digest HTML (dry run)
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-html
          path: data/digest-*.html
          retention-days: 7

      # DRY_RUN 의 오늘의 글은 data/preview 에만 쓴다 — 운영 글 목록에 섞이지 않게
      - name: Upload post preview (dry run)
        if: github.event.inputs.dry_run == 'true' && hashFiles('data/preview/posts/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: post-preview
          path: data/preview/
          retention-days: 7

      - name: Build web (Next.js static export)
        if: github.event.inputs.dry_run != 'true'
        env:
          NEXT_PUBLIC_BASE_URL: ${{ secrets.SITE_BASE_URL || 'https://jiehoonpark.github.io/development-digest/' }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        run: npm run build
        working-directory: web

      - name: Persist archives and posts inside web/out
        if: github.event.inputs.dry_run != 'true'
        run: |
          mkdir -p web/out/data/archives web/out/data/posts
          if [ -d data/archives ]; then
            cp -r data/archives/. web/out/data/archives/
          fi
          if [ -d data/posts ]; then
            cp -r data/posts/. web/out/data/posts/
          fi

      - name: Copy markdown to web/out
        if: github.event.inputs.dry_run != 'true' && hashFiles('data/markdown/**/*.md') != ''
        run: cp -r data/markdown web/out/markdown

      - name: Ensure .nojekyll
        if: github.event.inputs.dry_run != 'true'
        run: touch web/out/.nojekyll

      - name: Deploy to GitHub Pages
        if: github.event.inputs.dry_run != 'true' && hashFiles('web/out/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/out
          keep_files: true

      - name: Upload markdown (artifact)
        if: always() && hashFiles('data/markdown/**/*.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-markdown
          path: data/markdown/
          retention-days: 30

      # 앞 스텝이 하나라도 실패하면 실행 — 침묵 실패 방지.
      # RESEND_API_KEY/DIGEST_RECIPIENTS 는 뉴스레터 발송용을 그대로 재사용.
      - name: 파이프라인 실패 알림
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$DIGEST_RECIPIENTS" ]; then
            echo "RESEND_API_KEY 또는 DIGEST_RECIPIENTS 미설정 — 알림 건너뜀"
            exit 0
          fi
          TO_JSON=$(printf '%s' "$DIGEST_RECIPIENTS" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0))')
          PAYLOAD=$(jq -n \
            --argjson to "$TO_JSON" \
            --arg subject "❌ FE 데일리 리포트 실패 ($(TZ=Asia/Seoul date +%Y-%m-%d))" \
            --arg html "<p>오늘 FE 데일리 리포트 파이프라인이 실패했습니다.</p><p><a href=\"$RUN_URL\">실행 로그 보기 →</a></p>" \
            '{from:"Dev Digest <onboarding@resend.dev>", to:$to, subject:$subject, html:$html}')
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
