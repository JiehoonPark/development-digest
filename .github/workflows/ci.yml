name: 검증

# 수집·발송 없이 타입 검사와 테스트만. 정기 실행(digest.yml)에 들어가기 전에 PR 단계에서 막는다.
on:
  pull_request:
  # 작업 브랜치도 푸시마다 검증한다(gh-pages 는 빌드 산출물이라 제외)
  push:
    branches-ignore: [gh-pages]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 운영 러너와 같은 UTC 에서 돌려 날짜·요일 버그가 로컬(KST)에서만 통과하지 않게 한다
      TZ: UTC
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Pipeline — typecheck + tests
        run: |
          npm ci
          npm run verify

      # 오늘의 글 커버는 러너의 Chrome 으로 그린다 — 실제로 캡처되는지 확인하고 결과물을 남긴다
      - name: Cover — render smoke test
        run: npx tsx scripts/preview-covers.ts

      - name: Upload cover previews
        uses: actions/upload-artifact@v4
        with:
          name: cover-previews
          path: data/preview/covers-gallery/*.jpg
          retention-days: 7

      - name: Web — typecheck
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
